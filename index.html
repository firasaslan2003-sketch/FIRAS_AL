<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRASAL AI - تعديل الصور</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 50px auto; background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #007bff; }
        input, button, textarea { width: 100%; margin: 15px 0; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        textarea { height: 100px; resize: none; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; font-size: 16px; transition: 0.3s; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>تعديل الصور بالذكاء الاصطناعي</h2>
        <p>ارفع صورتك واكتب التعديل الذي تريده بالبرومبت</p>
        <input type="file" id="imageInput" accept="image/*">
        <textarea id="promptInput" placeholder="اكتب الأمر هنا (مثال: أضف نظارة شمسية للوجه، أو غير الخلفية لشاطئ)..."></textarea>
        <button onclick="editImage()">تعديل الصورة الآن</button>
        <div id="result"></div>
    </div>

    <script>
        async function editImage() {
            const imageInput = document.getElementById('imageInput');
            const promptInput = document.getElementById('promptInput');
            const resultDiv = document.getElementById('result');

            if (imageInput.files.length === 0 || !promptInput.value.trim()) {
                alert("الرجاء اختيار صورة وكتابة أمر التعديل أولاً!");
                return;
            }

            resultDiv.innerHTML = "<p>جاري معالجة الصورة بالذكاء الاصطناعي... انتظر قليلاً ⏳</p>";

            setTimeout(() => {
                resultDiv.innerHTML = "<p style='color: #ffc107;'>تم إعداد الواجهة بنجاح! الخطوة التالية هي ربط السيرفر الفعلي لمعالجة الصور.</p>";
            }, 2000);
        }
    </script>
</body>
</html>
