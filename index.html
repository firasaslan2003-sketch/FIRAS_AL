<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRASAL AI PRO</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 600px; }
        header { margin-bottom: 30px; text-align: center; }
        .card {
            background: #161b22;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
        }
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        #generateBtn { background: #238636; color: white; }
        #generateBtn:hover { background: #2ea043; }
        #generateBtn:disabled { background: #21262d; cursor: not-allowed; }
        #downloadBtn { background: #21262d; color: #58a6ff; border: 1px solid #30363d; text-decoration: none; display: none; text-align: center; line-height: 15px; }
        #statusMessage { margin-top: 15px; font-size: 14px; color: #8b949e; text-align: center; }
        .result-box {
            margin-top: 20px;
            min-height: 300px;
            background: #0d1117;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed #30363d;
        }
        #outputImage { max-width: 100%; display: none; }
        .loader {
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FIRASAL REALISM 📸</h1>
            <p>مشروع صور فوتوغرافية واقعية مستقر</p>
        </header>

        <main class="card">
            <textarea id="promptInput" placeholder="اكتب وصف الصورة بالإنجليزية (مثلاً: a beautiful white cat)..."></textarea>
            
            <div class="controls">
                <button id="generateBtn" onclick="startGeneration()">توليد الصورة ✨</button>
                <a id="downloadBtn" href="#" target="_blank" download="firasal-ai.png">تحميل الصورة 📥</a>
            </div>

            <div id="statusMessage"></div>

            <div class="result-box">
                <div id="loader" class="loader" style="display: none;"></div>
                <img id="outputImage" alt="AI Generated Result">
            </div>
        </main>
    </div>

    <script>
        function startGeneration() {
            var promptInput = document.getElementById('promptInput');
            var generateBtn = document.getElementById('generateBtn');
            var downloadBtn = document.getElementById('downloadBtn');
            var outputImage = document.getElementById('outputImage');
            var loader = document.getElementById('loader');
            var status = document.getElementById('statusMessage');

            var promptText = promptInput.value.trim();
            if (!promptText) return alert("يرجى إدخال وصف أولاً!");

            // تثبيت الواجهة لتوضيح عملية المعالجة
            generateBtn.disabled = true;
            loader.style.display = "block";
            outputImage.style.display = "none";
            downloadBtn.style.display = "none";
            status.innerText = "جاري جلب الصورة من خوادم الواقعية... ⏳";

            // إضافة محسنات الصورة الاحترافية
            var enhancements = ", photorealistic, 8k resolution, raw photo, highly detailed skin texture, dslr portrait";
            var cleanPrompt = encodeURIComponent(promptText + enhancements);
            var seed = Math.floor(Math.random() * 9999999);

            // البناء التقليدي المباشر للرابط المفتوح والمستقر لـ Pollinations لعام 2026
            var finalUrl = "https://image.pollinations.ai/prompt/" + cleanPrompt + "?width=1024&height=1024&seed=" + seed + "&model=flux&nologo=true";

            // إرسال الصورة للعرض المباشر في المتصفح لتفادي حظر الـ CORS
            outputImage.src = finalUrl;

            outputImage.onload = function() {
                loader.style.display = "none";
                outputImage.style.display = "block";
                downloadBtn.href = finalUrl;
                downloadBtn.style.display = "inline-block";
                generateBtn.disabled = false;
                status.innerText = "تمت المعالجة بنجاح! 🎉";
            };

            outputImage.onerror = function() {
                loader.style.display = "none";
                generateBtn.disabled = false;
                // رابط طوارئ صريح في حال منعت إعدادات الأمان المحلية الاتصال بالسيرفر
                status.innerHTML = "إذا حجب المتصفح الصورة، <a href='" + finalUrl + "' target='_blank' style='color: #58a6ff; font-weight: bold; text-decoration: underline;'>اضغط هنا لفتح الرابط وعرض الصورة فوراً</a>.";
            };
        }
    </script>
</body>
</html>
