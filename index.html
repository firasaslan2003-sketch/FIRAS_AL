<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Focus All</title>
    <style>
        body {
            background-color: #030712;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .glow-effect {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            z-index: 0;
            height: 400px;
            width: 800px;
            border-radius: 50%;
            background: linear-gradient(to right, #6d28d9, transparent, #3b82f6);
            opacity: 0.15;
            filter: blur(100px);
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .logo-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #2563eb;
            border-radius: 3px;
        }
        .logo-blue { color: #3b82f6; }
        h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 10px;
            line-height: 1.2;
        }
        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .desc {
            color: #9ca3af;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .options-row {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }
        .select-custom {
            flex: 1;
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #d1d5db;
            padding: 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }
        .search-box {
            display: flex;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 6px;
            align-items: center;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 16px;
            padding: 10px;
        }
        input::placeholder { color: #4b5563; }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; }
        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            color: #60a5fa;
            font-weight: 500;
        }
        .result-box {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: #030712;
            border: 1px solid #1f2937;
            padding: 15px;
            border-radius: 12px;
        }
        .image-wrapper {
            width: 100%;
            margin-top: 10px;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
        }
        .result-box img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .link-btn {
            background-color: #059669;
            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            width: 90%;
            margin-top: 15px;
            text-align: center;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        .link-btn:hover { background-color: #047857; }
    </style>
</head>
<body>

    <div class="glow-effect"></div>

    <div class="container">
        <div class="logo">
            <span class="logo-dot"></span>
            AI Focus <span class="logo-blue">All</span>
        </div>

        <h1>حول كلماتك إلى<br><span class="gradient-text">فن مذهل</span></h1>
        <p class="desc">استخدم قوة الذكاء الاصطناعي لتوليد صور فوتوغرافية فائقة الجودة وبجسم كامل فوراً.</p>

        <div class="card">
            <div class="options-row">
                <select id="shotType" class="select-custom">
                    <option value="full">جسم كامل بدون قطع (Full Body)</option>
                    <option value="medium">نصف علوي (Medium Shot)</option>
                    <option value="close">وجه مقرب (Close-up)</option>
                </select>
                <select id="aspectRatio" class="select-custom">
                    <option value="portrait">مقاس طولي طبيعي (768x1024)</option>
                    <option value="landscape">مقاس عرضي سينمائي (1024x768)</option>
                    <option value="square">مقاس مربع قياسي (1024x1024)</option>
                </select>
            </div>

            <div class="search-box">
                <input id="promptInput" type="text" placeholder="صف الصورة التي تتخيلها هنا بالإنجليزية...">
                <button id="generateBtn" onclick="processAIImage()">توليد</button>
            </div>

            <div id="statusMessage"></div>

            <div class="result-box" id="resultBox">
                <p style="margin: 0; color: #34d399; font-weight: bold;">🎉 تم توليد الصورة بنقاء فوتوغرافي كامل!</p>
                <div class="image-wrapper">
                    <img id="outputImage" alt="AI Generated Graphic Output">
                </div>
                <button id="downloadBtn" class="link-btn" onclick="saveImageToDevice()">تحميل الصورة بجهازك فوراً 📥</button>
            </div>
        </div>
    </div>

    <script>
        var cleanBlobUrl = ""; // لحفظ مسار الصورة النظيف والآمن بالمتصفح

        async function processAIImage() {
            var promptInput = document.getElementById('promptInput');
            var generateBtn = document.getElementById('generateBtn');
            var status = document.getElementById('statusMessage');
            var resultBox = document.getElementById('resultBox');
            var outputImage = document.getElementById('outputImage');
            var shotType = document.getElementById('shotType').value;
            var aspectRatio = document.getElementById('aspectRatio').value;

            var promptText = promptInput.value.trim();
            if (!promptText) return alert("يرجى وصف الصورة أولاً!");

            // 1. قفل الواجهة وتأكيد بدء الجلب لمنع التراقص
            generateBtn.disabled = true;
            status.innerText = "جاري جلب تفاصيل الكاميرا الحقيقية وبناء الملامح الحية... ⏳";
            resultBox.style.display = "none";

            var width = 1024;
            var height = 1024;
            if (aspectRatio === "landscape") { width = 1024; height = 768; }
            else if (aspectRatio === "portrait") { width = 768; height = 1024; }

            var shotDetail = "";
            if (shotType === "full") {
                shotDetail = ", full body standing shot, head to shoes visible, candid real photo";
            } else if (shotType === "medium") {
                shotDetail = ", medium portrait shot, waist up view";
            } else {
                shotDetail = ", detailed close-up portrait, sharp face focus";
            }

            var photographyFilters = shotDetail + ", professional dslr photograph, high quality real life photo, raw color tone, natural skin texture, visible pores, 8k resolution";
            var cleanPrompt = encodeURIComponent(promptText + photographyFilters);
            var seed = Math.floor(Math.random() * 9999999);

            // بناء رابط السيرفر المباشر
            var finalUrl = "https://pollinations.ai" + cleanPrompt + "?width=" + width + "&height=" + height + "&seed=" + seed + "&model=flux&enhance=false&nologo=true";

            // 2. استخدام نظام الطلب الخفي الصافي (Advanced Fetch Mode) لتخطي حظر الكود تماماً
            try {
                var response = await fetch(finalUrl);
                if (!response.ok) throw new Error("Server error");
                
                var blob = await response.blob();
                
                // تنظيف أي روابط قديمة بالذاكرة لمنع تراكم الملفات وتراقص الشاشة
                if (cleanBlobUrl) window.URL.revokeObjectURL(cleanBlobUrl);
                
                // تحويل المورد لصيغة آمنة ومصادق عليها محلياً داخل متصفحك
                cleanBlobUrl = window.URL.createObjectURL(blob);
                
                // عرض الصورة وتثبيتها بشكل صلب
                outputImage.src = cleanBlobUrl;
                status.innerText = "";
                generateBtn.disabled = false;
                resultBox.style.display = "flex";

            } catch (error) {
