<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Focus - تجربة توليد الصور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030712; /* اللون الداكن للموقع */
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glow-effect {
            background: linear-gradient(to right, #6d28d9, transparent, #3b82f6);
            opacity: 0.15;
            filter: blur(150px);
        }
        .select-custom {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #d1d5db;
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body class="relative min-h-screen overflow-x-hidden">

    <!-- تأثير الإضاءة الخلفية الملونة -->
    <div class="glow-effect absolute left-1/2 top-0 -translate-x-1/2 z-0 h-[500px] w-[1000px] rounded-full"></div>

    <!-- Content -->
    <div class="relative z-10 flex flex-col items-center justify-between min-h-screen px-4 py-8">
        
        <!-- الهيدر -->
        <header class="w-full max-w-6xl flex justify-between items-center">
            <div class="text-2xl font-bold flex items-center gap-2">
                <span class="w-8 h-8 bg-blue-600 rounded-lg"></span>
                AI Focus <span class="text-blue-500">All</span>
            </div>
            <div class="flex gap-4">
                <button class="text-gray-400 hover:text-white transition">تسجيل الدخول</button>
                <button class="bg-blue-600 px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition">ابدأ مجاناً</button>
            </div>
        </header>

        <!-- منطقة العمل (Input Area) -->
        <main class="w-full max-w-3xl flex flex-col items-center gap-8 text-center mt-20">
            <div>
                <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tight">
                    حول كلماتك إلى <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">فن مذهل</span>
                </h1>
                <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto">
                    استخدم قوة الذكاء الاصطناعي لتوليد صور فريدة وعالية الجودة في ثوانٍ معدودة وبدون حظر.
                </p>
            </div>

            <!-- أزرار التحكم في أبعاد اللقطة وحجم الصورة لمنع المط والقطع -->
            <div class="flex gap-4 w-full justify-center">
                <div class="flex flex-col text-right gap-1">
                    <span class="text-xs text-gray-500 mr-1">زاوية الكاميرا</span>
                    <select id="shotType" class="select-custom">
                        <option value="full">جسم كامل (Full Body)</option>
                        <option value="medium">نصف علوي (Medium Portrait)</option>
                        <option value="close">وجه مقرب (Close-up)</option>
                    </select>
                </div>
                <div class="flex flex-col text-right gap-1">
                    <span class="text-xs text-gray-500 mr-1">أبعاد ونسبة الصورة</span>
                    <select id="aspectRatio" class="select-custom">
                        <option value="portrait">طولية احترافية (768x1024)</option>
                        <option value="landscape">عرضية سينمائية (1024x768)</option>
                        <option value="square">مربعة قياسية (1024x1024)</option>
                    </select>
                </div>
            </div>

            <!-- مربع الإدخال (شريط البحث) -->
            <div class="w-full relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                <div class="relative flex bg-[#111827] border border-gray-800 rounded-xl p-2 shadow-2xl">
                    <input 
                        id="promptInput"
                        type="text" 
                        placeholder="صف الصورة التي تتخيلها هنا بالإنجليزية..." 
                        class="flex-1 bg-transparent border-none outline-none px-4 text-white text-lg placeholder:text-gray-600"
                    >
                    <button id="generateBtn" onclick="processAIImage()" class="bg-blue-600 px-8 py-3 rounded-lg font-bold hover:bg-blue-700 transition flex items-center gap-2">
                        <span id="btnText">توليد</span>
                        <svg id="btnIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </button>
                </div>
            </div>

            <!-- مكان ظهور رسائل الحالة ورابط التحميل المباشر بعد المعالجة -->
            <div id="statusMessage" class="text-sm font-medium text-blue-400"></div>
            
            <div id="resultBox" class="hidden w-full max-w-md bg-[#111827] border border-gray-800 p-4 rounded-xl flex flex-col items-center gap-3">
                <p class="text-sm text-green-400 font-semibold">🎉 تم إنشاء رابط الجودة الفوتوغرافية المعزول بنجاح!</p>
                <a id="downloadBtn" href="#" target="_blank" class="w-full bg-emerald-600 py-3 rounded-lg font-bold text-white hover:bg-emerald-700 transition text-center block">
                    اضغط هنا لفتح وتحميل الصورة بدقة DSLR حقيقية 📥
                </a>
            </div>
        </main>

        <!-- فوتر بسيط -->
        <footer class="text-gray-600 text-sm mt-12">
            &copy; 2026 AI Focus All - جميع الحقوق محفوظة
        </footer>
    </div>

    <script>
        function processAIImage() {
            var promptInput = document.getElementById('promptInput');
            var generateBtn = document.getElementById('generateBtn');
            var btnText = document.getElementById('btnText');
            var status = document.getElementById('statusMessage');
            var resultBox = document.getElementById('resultBox');
            var downloadBtn = document.getElementById('downloadBtn');
            var shotType = document.getElementById('shotType').value;
            var aspectRatio = document.getElementById('aspectRatio').value;

            var promptText = promptInput.value.trim();
            if (!promptText) return alert("يرجى وصف الصورة أولاً!");

            // 1. تنشيط حالة التحميل لتجنب التجميد اللانهائي للدائرة
            generateBtn.disabled = true;
            btnText.innerText = "جاري المعالجة...";
            status.innerText = "جاري تجميع تفاصيل الكاميرا وحقن ملامح الجلد الحقيقي... ⏳";
            resultBox.classList.add('hidden');

            // 2. ضبط الأبعاد المعتمدة برمجياً لمنع مط وتشوية الشاشة
            var width = 1024;
            var height = 1024;
            if (aspectRatio === "landscape") { width = 1024; height = 768; }
            else if (aspectRatio === "portrait") { width = 768; height = 1024; }

            // 3. صياغة تفاصيل زاوية الصورة لمنع القطع
            var shotDetail = "";
            if (shotType === "full") {
                shotDetail = ", full body standing shot, head to shoes visible, candid portrait";
            } else if (shotType === "medium") {
                shotDetail = ", medium portrait shot, waist up view";
            } else {
                shotDetail = ", detailed close-up portrait, sharp face features";
            }

            // 4. دمج مرشحات الواقعية الفائقة الصافية بدون إشارات حظر تسبب تجميد السيرفر
            var photographyFilters = shotDetail + ", professional dslr photograph, high quality real life photo, raw color tone, natural skin texture, visible pores, cinematic lighting, 8k resolution";
            var cleanPrompt = encodeURIComponent(promptText + photographyFilters);
            var seed = Math.floor(Math.random() * 9999999);

            // 5. بناء الرابط الصافي والمباشر المتجاوز تماماً لقيود حماية المتصفحات
            var finalUrl = "https://pollinations.ai" + cleanPrompt + 
                           "?width=" + width + 
                           "&height=" + height + 
                           "&seed=" + seed + 
                           "&model=flux&enhance=false&nologo=true";

            // 6. استجابة فورية ومعزولة تفتح الصورة مباشرة بدون تعليق
            setTimeout(function() {
                status.innerText = "";
                btnText.innerText = "توليد";
                generateBtn.disabled = false;
                
                // عرض الصندوق وتمرير الرابط المباشر
                resultBox.classList.remove('hidden');
                downloadBtn.href = finalUrl;
                
                // فتح فوري ومستقل للصورة في نافذة ويب جديدة نظيفة
                window.open(finalUrl, '_blank');
            }, 1000); // إتمام ممر الأمان في ثانية واحدة
        }
    </script>
</body>
</html>
