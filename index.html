<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRASAL AI - REAL PHOTO STUDIO</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #238636;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 650px; }
        header { margin-bottom: 25px; text-align: center; }
        header h1 { margin: 0; color: #fff; font-size: 28px; }
        header p { color: #8b949e; margin-top: 5px; }
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
        }
        textarea {
            width: 100%;
            height: 100px;
            background: var(--bg-color);
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
            outline: none;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 14px; color: #8b949e; }
        .select-box {
            padding: 12px;
            background: var(--bg-color);
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        .controls { display: flex; gap: 15px; margin-top: 20px; }
        button, .link-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            text-align: center;
            font-size: 16px;
        }
        #generateBtn { background: var(--accent-color); color: white; }
        #generateBtn:hover { background: #2ea043; }
        #statusMessage { margin-top: 15px; font-size: 14px; color: #58a6ff; text-align: center; font-weight: 500; }
        .result-container {
            margin-top: 25px;
            background: var(--bg-color);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
        }
        .link-btn {
            background: #007bff;
            color: white;
            display: inline-block;
            margin-top: 15px;
            width: 90%;
        }
        .link-btn:hover { background: #0069d9; }
        .url-display {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #8b949e;
            width: 90%;
            word-break: break-all;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FIRASAL AI STUDIO v16 📸</h1>
            <p>منصة جلب الروابط الفورية - تخطي مشكلة الدوران والتعليق الأمني للمتصفحات</p>
        </header>

        <main class="card">
            <textarea id="promptInput" placeholder="اكتب وصف الصورة بالتفصيل بالإنجليزية (مثال: full body photo of a man)..."></textarea>
            
            <div class="options-grid">
                <div class="control-group">
                    <label>نوع اللقطة والزاوية</label>
                    <select id="shotType" class="select-box">
                        <option value="full">لقطة كاملة للجسم (Full Body View)</option>
                        <option value="medium">لقطة نصفية من الخصر (Medium Shot)</option>
                        <option value="close">لقطة مقربة جداً للوجه (Close-up)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>أبعاد ونسبة الصورة</label>
                    <select id="aspectRatio" class="select-box">
                        <option value="portrait">طولية طبيعية (768x1024)</option>
                        <option value="landscape">عرضية سينمائية (1024x768)</option>
                        <option value="square">مربعة قياسية (1024x1024)</option>
                    </select>
                </div>
            </div>

            <div class="controls">
                <button id="generateBtn" onclick="processAIImage()">توليد الرابط المباشر الفوري ✨</button>
            </div>

            <div id="statusMessage"></div>

            <div class="result-container" id="resultContainer">
                <p style="margin:0; font-weight: bold; color: #fff;">تم تجهيز رابط الصورة الفوتوغرافية بنجاح! 🎉</p>
                <div class="url-display" id="urlDisplay"></div>
                <a id="downloadBtn" class="link-btn" href="#" target="_blank">اضغط هنا لفتح وتحميل الصورة بدقة DSLR حقيقية 📥</a>
            </div>
        </main>
    </div>

    <script>
        function processAIImage() {
            var promptInput = document.getElementById('promptInput');
            var downloadBtn = document.getElementById('downloadBtn');
            var resultContainer = document.getElementById('resultContainer');
            var urlDisplay = document.getElementById('urlDisplay');
            var status = document.getElementById('statusMessage');
            var shotType = document.getElementById('shotType').value;
            var aspectRatio = document.getElementById('aspectRatio').value;

            var promptText = promptInput.value.trim();
            if (!promptText) return alert("يرجى كتابة وصف الصورة أولاً!");

            status.innerText = "جاري معالجة الأبعاد وحقن مرشحات الواقعية الفورية... ⏳";

            // مقاسات معيارية مدعومة 100% تمنع تجميد المعالجة
            var width = 1024;
            var height = 1024;
            if (aspectRatio === "landscape") { width = 1024; height = 768; }
            else if (aspectRatio === "portrait") { width = 768; height = 1024; }

            var shotDetail = "";
            if (shotType === "full") {
                shotDetail = ", full body standing shot, head to shoes visible, candid portrait";
            } else if (shotType === "medium") {
                shotDetail = ", medium portrait shot, waist up view";
            } else {
                shotDetail = ", detailed close-up portrait, sharp face features";
            }

            // فلاتر نقية لا تسبب تعليق السيرفر وتفرض تفاصيل الجلد ومسام الوجه الكاملة
            var photographyFilters = shotDetail + ", professional dslr photograph, high quality real life photo, raw color tone, natural skin texture, visible pores, cinematic lighting, 8k resolution";
            var cleanPrompt = encodeURIComponent(promptText + photographyFilters);
            var seed = Math.floor(Math.random() * 9999999);

            // بناء الرابط النهائي المباشر الفائق المتجاوز لحظر المتصفحات
            var finalUrl = "https://image.pollinations.ai/prompt/" + cleanPrompt + 
                           "?width=" + width + 
                           "&height=" + height + 
                           "&seed=" + seed + 
                           "&model=flux" + 
                           "&nologo=true";

            // إظهار النتيجة فورا بدون لودينج معلق
            setTimeout(function() {
                status.innerText = "";
                resultContainer.style.display = "flex";
                urlDisplay.innerText = finalUrl;
                downloadBtn.href = finalUrl;
                
                // فتح تلقائي في نافذة جديدة معزولة لتخطي الدوران كلياً
                window.open(finalUrl, '_blank');
            }, 800); // استجابة فورية في أقل من ثانية
        }
    </script>
</body>
</html>
