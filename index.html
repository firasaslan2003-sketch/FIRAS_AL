<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRASAL AI PRO - HD</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 600px; }
        header { margin-bottom: 25px; text-align: center; }
        .card {
            background: #161b22;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #0d1117;
            color: white;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
        }
        .options-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .select-box {
            flex: 1;
            padding: 10px;
            background: #0d1117;
            color: #fff;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        button, .download-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            text-align: center;
            font-size: 16px;
        }
        #generateBtn { background: #238636; color: white; }
        #generateBtn:hover { background: #2ea043; }
        #generateBtn:disabled { background: #21262d; cursor: not-allowed; }
        #downloadBtn { background: #21262d; color: #58a6ff; border: 1px solid #30363d; display: none; line-height: 18px; }
        #statusMessage { margin-top: 15px; font-size: 14px; color: #8b949e; text-align: center; }
        .result-box {
            margin-top: 20px;
            min-height: 300px;
            background: #0d1117;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed #30363d;
        }
        #outputImage { max-width: 100%; max-height: 600px; display: none; object-fit: contain; }
        .loader {
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FIRASAL REALISM HD 📸</h1>
            <p>نسخة مستقرة فائقة الدقة والتحكم الكامل بالأبعاد</p>
        </header>

        <main class="card">
            <textarea id="promptInput" placeholder="اكتب وصف الصورة بالتفصيل بالإنجليزية..."></textarea>
            
            <div class="options-row">
                <select id="shotType" class="select-box">
                    <option value="full">صورة للجسم كاملاً (Full Body)</option>
                    <option value="medium">صورة للنصف العلوي (Medium Shot)</option>
                    <option value="face">صورة مقربة للوجه (Close-up)</option>
                </select>
                <select id="aspectRatio" class="select-box">
                    <option value="portrait">مقاس طولي (768x1024)</option>
                    <option value="landscape">مقاس عرضي (1024x768)</option>
                    <option value="square">مقاس مربع (1024x1024)</option>
                </select>
            </div>

            <div class="controls">
                <button id="generateBtn" onclick="startGeneration()">توليد فوتوغرافي واقعي حتماً ✨</button>
                <a id="downloadBtn" class="download-btn" href="#" target="_blank">تحميل الصورة 📥</a>
            </div>

            <div id="statusMessage"></div>

            <div class="result-box">
                <div id="loader" class="loader" style="display: none;"></div>
                <img id="outputImage" alt="AI Generated Result">
            </div>
        </main>
    </div>

    <script>
        function startGeneration() {
            var promptInput = document.getElementById('promptInput');
            var generateBtn = document.getElementById('generateBtn');
            var downloadBtn = document.getElementById('downloadBtn');
            var outputImage = document.getElementById('outputImage');
            var loader = document.getElementById('loader');
            var status = document.getElementById('statusMessage');
            var shotType = document.getElementById('shotType').value;
            var aspectRatio = document.getElementById('aspectRatio').value;

            var promptText = promptInput.value.trim();
            if (!promptText) return alert("يرجى إدخال وصف أولاً!");

            generateBtn.disabled = true;
            loader.style.display = "block";
            outputImage.style.display = "none";
            downloadBtn.style.display = "none";
            status.innerText = "جاري الاتصال بمحرك الدقة المستقرة... ⏳";

            // مقاسات مستقرة وسريعة ومضمونة التوليد بدون تجميد الطلب
            var width = 1024;
            var height = 1024;
            if (aspectRatio === "landscape") { width = 1024; height = 768; }
            else if (aspectRatio === "portrait") { width = 768; height = 1024; }

            // حقن أوامر مخصصة لمنع التشويه والقطع والكارتون
            var shotCommand = "";
            if (shotType === "full") {
                shotCommand = ", full body shot, standing portrait, outfit from head to toe visible, professional camera shot";
            } else if (shotType === "medium") {
                shotCommand = ", medium shot, waist up portrait";
            } else {
                shotCommand = ", ultra fine close-up portrait, face focus";
            }

            // فلاتر دقيقة ومكثفة لجلب الواقعية الحقيقية (مسام، تجاعيد، تفاصيل قماش) وتدمير الكارتون
            var realityFilters = shotCommand + ", realistic photography, highly detailed, 8k resolution, raw photo, sharp focus, natural skin texture, visible pores, cinematic lighting";

            var cleanPrompt = encodeURIComponent(promptText + realityFilters);
            var seed = Math.floor(Math.random() * 9999999);

            // رابط الإنتاج الأكثر استقراراً لموديل flux
            var finalUrl = "https://pollinations.ai" + cleanPrompt + 
                           "?width=" + width + 
                           "&height=" + height + 
                           "&seed=" + seed + 
                           "&model=flux" + 
                           "&nologo=true";

            outputImage.src = finalUrl;

            outputImage.onload = function() {
                loader.style.display = "none";
                outputImage.style.display = "block";
                downloadBtn.href = finalUrl;
                downloadBtn.style.display = "inline-block";
                generateBtn.disabled = false;
                status.innerText = "تم التوليد بنجاح وبأعلى دقة! 🎉";
            };

            outputImage.onerror = function() {
                loader.style.display = "none";
                generateBtn.disabled = false;
                status.innerHTML = "حدث ضغط لحظي على السيرفر، يرجى إعادة النقر على الزر. 🔄";
            };
        }
    </script>
</body>
</html>
